
name: Build SoHenBN

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.2-cefsharp-browser

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build WPF application
        shell: pwsh
        run: |
          msbuild PatientAppointmentManager.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:PlatformTarget=x64 `
            /p:Prefer32Bit=false

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed: $LASTEXITCODE"
          }

      - name: Locate and collect SoHenBN files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $publish = Join-Path $root "publish"

          # Tìm EXE ở tất cả thư mục, kể cả obj
          $exe = Get-ChildItem -Path $root `
            -Recurse -File `
            -Filter "SoHenBN.exe" |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git)[\\/]'
            } |
            Sort-Object {
              if ($_.FullName -match '[\\/]bin[\\/]') { 0 }
              elseif ($_.FullName -match '[\\/]obj[\\/]') { 1 }
              else { 2 }
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Không tìm thấy SoHenBN.exe"
            Get-ChildItem $root -Recurse -Filter "*.exe" |
              Select-Object -ExpandProperty FullName
            throw "SoHenBN.exe was not found."
          }

          Write-Host "Đã tìm thấy EXE:"
          Write-Host $exe.FullName

          # Tạo thư mục phát hành
          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item -ItemType Directory -Path $publish -Force |
            Out-Null

          # Sao chép toàn bộ file cùng thư mục chứa EXE
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') `
            -Destination $publish `
            -Recurse -Force

          # Kiểm tra file EXE sau khi sao chép
          $finalExe = Join-Path $publish "SoHenBN.exe"

          if (-not (Test-Path $finalExe)) {
            throw "Không có SoHenBN.exe trong thư mục phát hành."
          }

          Write-Host "Đã thu thập thành công:"
          Get-ChildItem $publish -Recurse -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: SoHenBN-v0.6.0-WindowsClassic-Win64
          path: publish/
          if-no-files-found: error
